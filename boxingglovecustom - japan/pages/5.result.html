<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5. 定制方案确认 | BUFFALO BOXING</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 40px 20px; 
      max-width: 750px; 
      margin: 0 auto; 
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.7;
    }
    .page-frame {
      background: #ffffff;
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      padding: 48px 40px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #1a1a1a;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #1a1a1a;
    }
    .brand-series {
      font-size: 11px;
      letter-spacing: 4px;
      color: #666;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .page-title { 
      font-size: 20px; 
      font-weight: 500; 
      color: #1a1a1a; 
      margin-bottom: 36px; 
      text-align: center;
      letter-spacing: 1px;
    }
    .result-item { 
      display: flex; 
      justify-content: space-between; 
      padding: 14px 0; 
      border-bottom: 1px solid #f0f0f0; 
      font-size: 14px;
    }
    .item-label { color: #999; }
    .item-value { color: #1a1a1a; font-weight: 500; text-align: right; }
    .color-swatch { 
      display: inline-block; 
      width: 14px; 
      height: 14px; 
      border-radius: 2px; 
      margin-right: 8px; 
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .section-title { 
      font-weight: 500; 
      margin: 32px 0 16px; 
      color: #1a1a1a; 
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .custom-section { 
      padding: 18px 20px; 
      background: #fafafa; 
      border-radius: 2px; 
      margin-bottom: 12px; 
      border: 1px solid #f0f0f0;
    }
    .custom-detail { 
      margin: 6px 0; 
      font-size: 14px; 
      color: #333; 
    }
    .color-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 0 24px; 
    }
    .color-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      font-size: 14px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .final-price { 
      margin: 36px 0 20px; 
      padding: 28px 24px; 
      background: #fafafa; 
      border-radius: 2px; 
      text-align: center; 
      border: 1px solid #1a1a1a;
    }
    .final-price-text { 
      font-size: 12px; 
      color: #666; 
      margin-bottom: 8px; 
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .final-price-num { 
      font-size: 30px; 
      font-weight: 500; 
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }
    .note { 
      font-size: 12px; 
      color: #999; 
      margin: 20px 0; 
      line-height: 1.8; 
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .prev-btn, .copy-btn {
      flex: 1;
      padding: 16px;
      border-radius: 2px;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s ease;
    }
    .prev-btn {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #d9d9d9;
    }
    .prev-btn:hover {
      border-color: #1a1a1a;
    }
    .copy-btn {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #1a1a1a;
    }
    .copy-btn:hover {
      background: #000;
      border-color: #000;
    }
  </style>
</head>
<body>
  <div class="page-frame">
    <div class="brand-header">
      <div class="brand-name">BUFFALO BOXING</div>
      <div class="brand-series">Darwin Custom Series</div>
    </div>

    <div class="page-title">定制方案确认 / Confirmation</div>
    
    <div class="result-item">
      <div class="item-label">拳套尺寸</div>
      <div class="item-value" id="sizeVal">--</div>
    </div>
    <div class="result-item">
      <div class="item-label">皮革类型</div>
      <div class="item-value" id="leatherVal">--</div>
    </div>
    <div class="result-item">
      <div class="item-label">Logo 颜色</div>
      <div class="item-value" id="logoColorVal">原色</div>
    </div>
    <div class="result-item">
      <div class="item-label">Logo 工艺</div>
      <div class="item-value" id="logoStitchVal">外缝</div>
    </div>
    
    <div class="section-title">各区域配色</div>
    <div class="color-grid" id="colorGrid"></div>
    
    <div class="section-title">手腕内侧印字</div>
    <div class="custom-section" id="printDetail"></div>
    
    <div class="section-title">手腕内侧图案</div>
    <div class="custom-section" id="patternDetail"></div>
    
    <div class="result-item">
      <div class="item-label">Logo 替换</div>
      <div class="item-value" id="logoReplaceVal">未选择</div>
    </div>
    <div class="result-item">
      <div class="item-label">手背刺绣</div>
      <div class="item-value" id="embroideryVal">未选择</div>
    </div>
    <div class="result-item">
      <div class="item-label">配色额外费用</div>
      <div class="item-value" id="colorVal">¥0</div>
    </div>
    <div class="result-item">
      <div class="item-label">定制额外费用</div>
      <div class="item-value" id="customVal">¥0</div>
    </div>

    <div class="final-price">
      <div class="final-price-text">Estimated Total · 预估总价</div>
      <div class="final-price-num" id="totalPrice">¥0</div>
      <div style="font-size:12px; color:#999; margin-top:6px;">不含刺绣费用</div>
    </div>

    <div class="note">
      1. 手背刺绣需提供图案，客服将根据复杂度单独报价<br>
      2. 最终价格以客服确认方案后核算为准<br>
      3. 复制方案后可直接发送给客服对接下单
    </div>

    <div class="btn-group">
      <button class="prev-btn" id="prevBtn">BACK · 返回修改</button>
      <button class="copy-btn" onclick="copyResult()">COPY · 复制方案</button>
    </div>
  </div>

  <script>
    const areaNames = {
      '1': '区域 ①',
      '2': '区域 ②',
      '3': '区域 ③',
      '4': '区域 ④',
      '5': '区域 ⑤',
      '6': '区域 ⑥',
      '7': '区域 ⑦',
      '8': '区域 ⑧'
    };

    const colorNames = {
      '#FFFFFF': 'F001 纯白',
      '#F5F0EB': 'F002 奶昔白',
      '#9D5F3B': 'F003 金棕',
      '#746148': 'F004 大象灰',
      '#1E2E44': 'F005 午夜蓝',
      '#000000': 'F006 黑色',
      '#80412D': 'F033 焦糖棕',
      '#3FBF72': 'F032 漫画绿',
      '#B3A59A': 'F009 风衣灰',
      '#F27D3C': 'F010 橙色',
      '#F2C12E': 'F011 太阳黄',
      '#F9E77F': 'F012 小鸡黄',
      '#404234': 'F013 橄榄绿',
      '#BDE0F2': 'F014 微风蓝',
      '#A0E7E5': 'F015 tiffany蓝',
      '#0D32C4': 'F016 克莱因蓝',
      '#91A3B1': 'F017 亚麻蓝',
      '#C0A086': 'F018 马拉茶色',
      '#8C8969': 'F019 鼠尾草绿',
      '#808080': 'F020 积雨云灰',
      '#BE3033': 'F021 大红',
      '#EEB9C9': 'F022 樱花粉',
      '#DF6981': 'F023 蔷薇粉',
      '#E4A3BB': 'F031 花瓣粉',
      '#6A2A30': 'F029 酒红',
      '#FFD700': 'F025 柠檬黄',
      '#C6AEA6': 'F026 杏色',
      '#294162': 'F030 深邃蓝',
      '#C0C0C0': 'F027 海鸥灰',
      '#402D2D': 'F028 深咖'
    };

    window.onload = function() {
      const size = localStorage.getItem('customSize') || '未选择';
      const leather = localStorage.getItem('leatherType') || '未选择';
      const basePrice = parseInt(localStorage.getItem('basePrice')) || 0;
      const colorExtra = parseInt(localStorage.getItem('colorExtra')) || 0;
      const customExtra = parseInt(localStorage.getItem('customExtra')) || 0;
      const areaColors = JSON.parse(localStorage.getItem('areaColors')) || {};
      const customOptions = JSON.parse(localStorage.getItem('customOptions')) || {};

      document.getElementById('sizeVal').innerText = size + ' oz';
      document.getElementById('leatherVal').innerText = leather;
      document.getElementById('colorVal').innerText = '¥' + colorExtra;
      document.getElementById('customVal').innerText = '¥' + customExtra;

      const logoColorMap = {
        'logoDefault': '原色植鞣牛皮 Logo',
        'logoContrast': '撞色 Logo（与手背同色）',
        'logoTextGold': '烫金文字 LOGO',
        'logoTextSilver': '烫银文字 LOGO'
      };
      const logoColorText = logoColorMap[customOptions.logoColor] || '原色植鞣牛皮';
      
      const logoStitchMap = {
        'stitchOuter': '外缝',
        'stitchInner': '内缝',
        'stitchPrintOnly': '烫印（无缝纫）'
      };
      const logoStitchText = logoStitchMap[customOptions.logoStitch] || '外缝';
      
      document.getElementById('logoColorVal').innerText = logoColorText;
      document.getElementById('logoStitchVal').innerText = logoStitchText;

      document.getElementById('logoReplaceVal').innerText = customOptions.logoReplace === 'yes' ? '已选择（+ ¥70）' : '未选择';
      document.getElementById('embroideryVal').innerText = customOptions.embroidery === 'yes' ? '已选择（¥100-300，待报价）' : '未选择';

      const colorGrid = document.getElementById('colorGrid');
      colorGrid.innerHTML = '';
      for (let i = 1; i <= 8; i++) {
        const colorCode = areaColors[i];
        const colorItem = document.createElement('div');
        colorItem.className = 'color-item';
        
        if (colorCode) {
          const colorName = colorNames[colorCode] || colorCode;
          colorItem.innerHTML = `
            <span>${areaNames[i]}</span>
            <span>
              <span class="color-swatch" style="background-color: ${colorCode};"></span>
              ${colorName}
            </span>
          `;
        } else {
          colorItem.innerHTML = `
            <span>${areaNames[i]}</span>
            <span style="color:#ccc;">未选择</span>
          `;
        }
        
        colorGrid.appendChild(colorItem);
      }

      const printDetail = document.getElementById('printDetail');
      let printHtml = '';
      
      if (customOptions.leftEngText || customOptions.leftChText) {
        const content = customOptions.leftEngText || customOptions.leftChText;
        const type = customOptions.leftEngText ? '英文/数字' : '汉字（+ ¥30）';
        const font = customOptions.leftEngFont === 'cursive' ? '花体' : '正体';
        const color = getColorText(customOptions.leftPrintColor || 'leftGold');
        
        printHtml += `<div class="custom-detail"><strong>左手</strong>　${type}「${content}」· ${font} · ${color}</div>`;
      } else {
        printHtml += '<div class="custom-detail">左手　未定制</div>';
      }
      
      if (customOptions.rightEngText || customOptions.rightChText) {
        const content = customOptions.rightEngText || customOptions.rightChText;
        const type = customOptions.rightEngText ? '英文/数字' : '汉字（+ ¥30）';
        const font = customOptions.rightEngFont === 'cursive' ? '花体' : '正体';
        const color = getColorText(customOptions.rightPrintColor || 'rightGold');
        
        printHtml += `<div class="custom-detail"><strong>右手</strong>　${type}「${content}」· ${font} · ${color}</div>`;
      } else {
        printHtml += '<div class="custom-detail">右手　未定制</div>';
      }
      
      printDetail.innerHTML = printHtml;

      const patternDetail = document.getElementById('patternDetail');
      let patternHtml = '';
      
      if (customOptions.leftWristPattern === 'yes') {
        const color = getPatternColorText(customOptions.leftPatternColor || 'leftPatternGold');
        patternHtml += `<div class="custom-detail"><strong>左手</strong>　已定制（+ ¥30）· ${color}</div>`;
      } else {
        patternHtml += '<div class="custom-detail">左手　未定制</div>';
      }
      
      if (customOptions.rightWristPattern === 'yes') {
        const color = getPatternColorText(customOptions.rightPatternColor || 'rightPatternGold');
        patternHtml += `<div class="custom-detail"><strong>右手</strong>　已定制（+ ¥30）· ${color}</div>`;
      } else {
        patternHtml += '<div class="custom-detail">右手　未定制</div>';
      }
      
      patternDetail.innerHTML = patternHtml;

      const total = basePrice + colorExtra + customExtra;
      document.getElementById('totalPrice').innerText = '¥' + total;
    };

    function getColorText(colorId) {
      if (colorId.includes('Gold')) return '烫金';
      if (colorId.includes('Silver')) return '烫银';
      if (colorId.includes('Original')) return '原色烙印';
      return '默认';
    }

    function getPatternColorText(colorId) {
      if (colorId.includes('Gold')) return '烫金';
      if (colorId.includes('Silver')) return '烫银';
      if (colorId.includes('Original')) return '原色烙印';
      return '默认';
    }

    // 优化排版后的复制方案
    function copyResult() {
      const size = document.getElementById('sizeVal').innerText;
      const leather = document.getElementById('leatherVal').innerText;
      const logoColor = document.getElementById('logoColorVal').innerText;
      const logoStitch = document.getElementById('logoStitchVal').innerText;
      const colorExtra = document.getElementById('colorVal').innerText;
      const customExtra = document.getElementById('customVal').innerText;
      const logoReplace = document.getElementById('logoReplaceVal').innerText;
      const embroidery = document.getElementById('embroideryVal').innerText;
      const total = document.getElementById('totalPrice').innerText;
      
      const areaColors = JSON.parse(localStorage.getItem('areaColors')) || {};
      const customOptions = JSON.parse(localStorage.getItem('customOptions')) || {};

      // 各区域配色文本
      let colorText = '';
      for (let i = 1; i <= 8; i++) {
        const colorCode = areaColors[i];
        if (colorCode) {
          const colorName = colorNames[colorCode] || colorCode;
          colorText += `  ${areaNames[i]}：${colorName}\n`;
        }
      }
      if (!colorText) colorText = '  未进行颜色选择\n';

      // 手腕印字 - 左右手分行
      let leftPrint = '未定制';
      let rightPrint = '未定制';
      
      if (customOptions.leftEngText || customOptions.leftChText) {
        const content = customOptions.leftEngText || customOptions.leftChText;
        const type = customOptions.leftEngText ? '英文/数字' : '汉字（+ ¥30）';
        const font = customOptions.leftEngFont === 'cursive' ? '花体' : '正体';
        const color = getColorText(customOptions.leftPrintColor || 'leftGold');
        leftPrint = `${type}「${content}」· ${font} · ${color}`;
      }
      
      if (customOptions.rightEngText || customOptions.rightChText) {
        const content = customOptions.rightEngText || customOptions.rightChText;
        const type = customOptions.rightEngText ? '英文/数字' : '汉字（+ ¥30）';
        const font = customOptions.rightEngFont === 'cursive' ? '花体' : '正体';
        const color = getColorText(customOptions.rightPrintColor || 'rightGold');
        rightPrint = `${type}「${content}」· ${font} · ${color}`;
      }

      // 手腕图案 - 左右手分行
      let leftPattern = '未定制';
      let rightPattern = '未定制';
      
      if (customOptions.leftWristPattern === 'yes') {
        const color = getPatternColorText(customOptions.leftPatternColor || 'leftPatternGold');
        leftPattern = `已定制（+ ¥30）· ${color}`;
      }
      if (customOptions.rightWristPattern === 'yes') {
        const color = getPatternColorText(customOptions.rightPatternColor || 'rightPatternGold');
        rightPattern = `已定制（+ ¥30）· ${color}`;
      }

      const resultText = 
`BUFFALO BOXING · Darwin 系列定制方案
────────────────────
1. 拳套尺寸：${size}
2. 皮革类型：${leather}
3. Logo 配置
  颜色：${logoColor}
  工艺：${logoStitch}
4. 各区域配色
${colorText}
5. 手腕内侧印字
  左手：${leftPrint}
  右手：${rightPrint}
6. 手腕内侧图案
  左手：${leftPattern}
  右手：${rightPattern}
7. Logo 替换：${logoReplace}
8. 手背刺绣：${embroidery}
9. 配色额外费用：${colorExtra}
10. 定制额外费用：${customExtra}
11. 预估总价（不含刺绣）：${total}
────────────────────
备注：请客服确认方案并核算最终价格，刺绣需提供图案对接报价。`;

      // 优先现代API，失败降级，兼容移动端
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(resultText).then(() => {
          alert('方案已复制，可直接发送给客服');
        }).catch(() => {
          fallbackCopy(resultText);
        });
      } else {
        fallbackCopy(resultText);
      }
    }

    // 降级复制方法
    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.top = '0';
      textarea.style.left = '0';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        alert('方案已复制，可直接发送给客服');
      } catch (err) {
        alert('复制失败，请手动复制方案内容');
      }
      document.body.removeChild(textarea);
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      window.location.href = '4.customize.html';
    });
  </script>
</body>
</html>
