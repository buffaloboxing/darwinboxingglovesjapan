    const BBSUIT_KEY = 'bb_suit';
    function BB_suit(){ try{ return JSON.parse(localStorage.getItem(BBSUIT_KEY)) || null; }catch(e){ return null; } }
    function BB_prefix(){
      const s = BB_suit();
      if(!s || !Array.isArray(s.items) || !s.items.length) return '';
      const idx = (typeof s.current === 'number') ? s.current : 0;
      return 'bb_' + idx + '_';
    }
    const LS = {
      get(k){ return localStorage.getItem(BB_prefix() + k); },
      set(k,v){ localStorage.setItem(BB_prefix() + k, v); },

    /* ==================== 状态与画布 ==================== */
    const zoneColors = {};
    for (let i = 1; i <= LAYERS; i++) zoneColors[i] = null;
    let current = 1;

    const container = document.getElementById('canvasContainer');
    const loadingTip = document.getElementById('loadingTip');
    const zoneSelect = document.getElementById('zoneSelect');
    const colorGrid = document.getElementById('colorGrid');
    const extraText = document.getElementById('extraText');
    const totalPrice = document.getElementById('totalPrice');
    const ruleNote = document.getElementById('ruleNote');
    const leatherTip = document.getElementById('leatherTip');
    const toast = document.getElementById('toast');
    const wildBox = document.getElementById('wildBox');
    const wildSwatch = document.getElementById('wildSwatch');

    const canvases = [], ctxs = [], images = [], tintedData = [];
    for (let i = 0; i < LAYERS; i++) {
      const cvs = document.createElement('canvas');
      cvs.width = CANVAS.w; cvs.height = CANVAS.h;
      cvs.style.zIndex = LAYERS - i;
      container.appendChild(cvs);
      canvases.push(cvs); ctxs.push(cvs.getContext('2d')); tintedData.push(null);
    }

    const structCanvas = document.createElement('canvas');
    structCanvas.width = CANVAS.w; structCanvas.height = CANVAS.h;
    structCanvas.style.zIndex = 999;
    container.appendChild(structCanvas);
    const structCtx = structCanvas.getContext('2d');

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed to load'));
        img.src = src;
      });
    }

    async function initImages() {
      const list = [];
      for (let i = 0; i < LAYERS; i++) list.push(loadImage(GROIN_LAYERS[i]));
      const loaded = await Promise.all(list);
      loaded.forEach((img, idx) => { images[idx] = img; renderLayer(idx); });
      loadImage(STRUCTURE_URL).then(function(img){ structCtx.drawImage(img, 0, 0); });
      loadingTip.style.display = 'none';
    }

    function renderLayer(idx) {
      const ctx = ctxs[idx];
      ctx.clearRect(0, 0, CANVAS.w, CANVAS.h);
      ctx.drawImage(images[idx], 0, 0);
      if (tintedData[idx]) {
        const t = document.createElement('canvas');
        t.width = CANVAS.w; t.height = CANVAS.h;
        const tctx = t.getContext('2d');
        tctx.drawImage(images[idx], 0, 0);
        const alpha = tctx.getImageData(0, 0, CANVAS.w, CANVAS.h);
        const tinted = tintedData[idx];
        for (let i = 0; i < alpha.data.length; i += 4) {
          tinted.data[i + 3] = alpha.data[i + 3] > 0 ? alpha.data[i + 3] : 0;
        }
        ctx.putImageData(tinted, 0, 0);
      }
    }

    function tintLayer(idx, hex) {
      const ctx = ctxs[idx];
      ctx.drawImage(images[idx], 0, 0);
      const imageData = ctx.getImageData(0, 0, CANVAS.w, CANVAS.h);
      const d = imageData.data;
      const rT = parseInt(hex.slice(1, 3), 16);
      const gT = parseInt(hex.slice(3, 5), 16);
      const bT = parseInt(hex.slice(5, 7), 16);
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] === 0) continue;
        d[i] = (d[i] / 255) * rT;
        d[i + 1] = (d[i + 1] / 255) * gT;
        d[i + 2] = (d[i + 2] / 255) * bT;
      }
      tintedData[idx] = imageData;
      renderLayer(idx);
    }

    /* ==================== Area Dropdown ==================== */
    function renderSelect() {
      zoneSelect.innerHTML = '';
      for (let i = 1; i <= LAYERS; i++) {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `エリア${i} · ${ZONES[i]}`;
        if (i === current) o.selected = true;
        zoneSelect.appendChild(o);
      }
    }
    zoneSelect.addEventListener('change', () => {
      current = parseInt(zoneSelect.value, 10);
      renderColors();
    });

    /* ==================== Color Card ==================== */
    function renderColors() {
      colorGrid.innerHTML = '';
      COLORS.forEach(([hex, nm]) => {
        const cell = document.createElement('div');
        cell.className = 'color-cell';
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = hex;
        if (zoneColors[current] === hex) dot.classList.add('selected');
        dot.addEventListener('click', () => {
          zoneColors[current] = hex;
          tintLayer(current - 1, hex);
          renderColors(); calc();
          MEM_addColor(hex);
        });
        const cap = document.createElement('div');
        cap.className = 'color-cap';
        cap.textContent = nm;
        cell.appendChild(dot); cell.appendChild(cap);
        colorGrid.appendChild(cell);
      });
      syncSelection();
    }

    /* Wild Buffalo Leather色块：Groin Guard任意Area可用 */
    function setupWildBox() {
      wildBox.classList.toggle('show', isWild);
      wildBox.onclick = () => {
        zoneColors[current] = WILD_COLOR;
      MEM_addColor(WILD_COLOR);
        tintLayer(current - 1, WILD_COLOR);
        renderColors(); calc();
      };
    }

    function syncSelection() {
      wildSwatch.classList.toggle('selected', zoneColors[current] === WILD_COLOR);
    }

    function showToast(m) { toast.textContent = m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1700); }

    document.getElementById('solidBtn').onclick = () => {
      const c = zoneColors[current];
      if (!c) { showToast('Please pick a color from the color card first.'); return; }
      for (let i = 1; i <= LAYERS; i++) { zoneColors[i] = c; tintLayer(i - 1, c); }
      renderColors(); calc();
      showToast('All areas set to the same color.');
    };

    /* ==================== Pricing ==================== */
    const leatherType = LS.get('leatherType') || '';
    const basePrice = parseInt(LS.get('basePrice'), 10) || 290;
    const isWild = leatherType.includes('Wild Buffalo Leather');
    function bbMoney(usd){ return '¥' + (usd * 160).toLocaleString('en-US'); }

    function calc() {
      const usedColors = new Set();
      for (let i = 1; i <= LAYERS; i++) {
        const c = zoneColors[i];
        if (!c) continue;
        if (c === WILD_COLOR) continue;
        usedColors.add(c);
      }
      const freeQuota = isWild ? 3 : 2;
      const over = Math.max(0, usedColors.size - freeQuota);
      const extra = over * 40;
      extraText.textContent = `${usedColors.size} colors · Extra ` + bbMoney(extra);
      totalPrice.textContent = bbMoney(basePrice + extra);
      LS.set('areaColors', JSON.stringify(zoneColors));
      LS.set('colorExtra', extra);
    }

    /* ==================== 规则与Leather提示 ==================== */
    ruleNote.innerHTML =
      'All areas: 2 free colors; each extra color +¥6,400.<br>' +
      'After choosing Wild Buffalo Leather, the Wild Buffalo Leather block above represents that selection; it does not count toward the free color quota and raises the free quota to 3.';

    if (isWild) {
      leatherTip.textContent = 'ワイルドバッファロー革は専用のカラーカードを使います。上のワイルドバッファロー革のブロックを選ぶと、このエリアにワイルドバッファロー革が適用され、無料色の枠には数えられません。グロインガードのどのエリアでも使え、無料色が1色増えます（無料は最大3色）。オリジナル箔押しは、該当エリアがワイルドバッファロー革のときのみ可能です。';
      leatherTip.style.display = 'block';
    }

    /* ==================== Navigation ==================== */
    document.getElementById('prevBtn').onclick = () => { window.location.href = 'c2.groin-leather.html'; };
    function validateWild() {
      if (!isWild) return true;
      const used = Object.values(zoneColors).some(c => c === WILD_COLOR);
      if (!used) {
        alert('革のページでワイルドバッファロー革を選んでいます。このステップでワイルドバッファロー革のカラーを適用してください。少なくとも1つのエリアでワイルドバッファロー革を選択してください。');
        return false;
      }
      return true;
    }
    document.getElementById('nextBtn').onclick = () => {
      if (!validateWild()) return;
      window.location.href = 'c4.groin-customize.html';
    };

    /* ==================== 初始化 ==================== */
    function restoreColors() {
      try {
        const saved = JSON.parse(LS.get('areaColors'));
        if (saved) { for (let i = 1; i <= LAYERS; i++) if (saved[i]) zoneColors[i] = saved[i]; }
      } catch (e) { /* 忽略损坏Data */ }
    }

    renderSelect();
    restoreColors();
    setupWildBox();
    renderColors();
    renderMemColors();
    calc();
    initImages().then(() => {
      for (let i = 1; i <= LAYERS; i++) if (zoneColors[i]) tintLayer(i - 1, zoneColors[i]);
    }).catch(err => { console.error(err); });
      document.getElementById('stepNav').addEventListener('click', function(e){
      const it = e.target.closest('.step-nav-item');
      if (!it) return;
      try { if (window.__bbSave) window.__bbSave(); } catch(err){}
      window.location.href = it.dataset.href;
    });
    /* ===== 全局记忆库 bb_memory（跨装备共享，不随件前缀隔离） ===== */
    function MEM_get(){ try{ return JSON.parse(localStorage.getItem('bb_memory')) || {colors:[],texts:[],logo:null}; }catch(e){ return {colors:[],texts:[],logo:null}; } }
    function MEM_save(m){ localStorage.setItem('bb_memory', JSON.stringify(m)); }
    function MEM_addColor(hex){
      if(!hex) return;
      const m = MEM_get();
      m.colors = m.colors.filter(c=>c!==hex);
      m.colors.unshift(hex);
      m.colors = m.colors.slice(0,8);
      MEM_save(m);
    }
    function renderMemColors(){
      const m = MEM_get();
      const row = document.getElementById('memColorRow');
      const box = document.getElementById('memColorDots');
      if(!m.colors.length){ row.classList.remove('show'); return; }
      box.innerHTML='';
      m.colors.forEach(hex=>{
        const d=document.createElement('div');
        d.className='mem-dot'; d.style.background=hex; d.title=hex;
        d.onclick=()=>memApplyColor(hex);
        box.appendChild(d);
      });
      row.classList.add('show');
    }
    function memApplyColor(hex){
      zoneColors[current]=hex;
      tintLayer(current-1,hex);
      renderColors(); calc();
      MEM_addColor(hex);
    }
</script>

        var b=document.getElementById('gnBundle');
        if(b && st && st.mode==='suit') b.style.display='inline-block';
      }catch(e){}
    })();
  </script>
