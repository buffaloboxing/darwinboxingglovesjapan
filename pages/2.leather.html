<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2. レザーの種類を選択 | BUFFALO BOXING</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", "Segoe UI", Arial, sans-serif;
      padding: 40px 20px; 
      max-width: 750px; 
      margin: 0 auto; 
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .page-frame {
      background: #ffffff;
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      padding: 48px 40px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid #1a1a1a;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #1a1a1a;
    }
    .brand-series {
      font-size: 11px;
      letter-spacing: 4px;
      color: #666;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .page-title { 
      font-size: 20px; 
      font-weight: 500; 
      margin-bottom: 24px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }
    .current-price {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    .current-price span {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a1a;
      margin-left: 8px;
    }
    .leather-list { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-bottom: 60px; 
    }
    .leather-item { 
      border: 1px solid #d9d9d9; 
      padding: 18px 20px; 
      border-radius: 2px; 
      cursor: pointer; 
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }
    .leather-item:hover {
      border-color: #1a1a1a;
    }
    .leather-item.active { 
      border-color: #1a1a1a; 
      background: #fafafa; 
      color: #1a1a1a;
    }
    .price-tag { 
      color: #1a1a1a; 
      font-weight: 500;
      font-size: 15px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .prev-btn, .next-btn {
      flex: 1;
      padding: 16px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 2px;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .prev-btn {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #d9d9d9;
    }
    .prev-btn:hover {
      border-color: #1a1a1a;
    }
    .next-btn {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #1a1a1a;
    }
    .next-btn:hover {
      background: #000;
      border-color: #000;
    }
  </style>
</head>
<body>
  <div class="page-frame">
    <div class="brand-header">
      <div class="brand-name">BUFFALO BOXING</div>
      <div class="brand-series">DARWIN CUSTOM SERIES</div>
    </div>

    <div class="page-title">レザーの種類を選択</div>
    
    <!-- 统一价格显示（日元） -->
    <div class="current-price">現在の価格：¥<span id="currentPriceJPY">57,000</span></div>
    
    <div class="leather-list" id="leatherList">
      <div class="leather-item active" data-type="Swift Cowhide" data-price-jpy="57000">
        スウィフトカウハイド <span class="price-tag">¥57,000</span>
      </div>
      <div class="leather-item" data-type="Swift Cowhide + Curtiba Wild Cowhide" data-price-jpy="63000">
        スウィフトカウハイド + クルティバワイルドカウハイド <span class="price-tag">¥63,000</span>
      </div>
      <div class="leather-item" data-type="Swift Cowhide + Shark Skin" data-price-jpy="110000">
        スウィフトカウハイド + シャークスキン <span class="price-tag">¥110,000</span>
      </div>
      <div class="leather-item" data-type="Swift Cowhide + Crocodile Skin" data-price-jpy="122000">
        スウィフトカウハイド + クロコダイルスキン <span class="price-tag">¥122,000</span>
      </div>
      <div class="leather-item" data-type="Swift Cowhide + Ostrich Skin" data-price-jpy="122000">
        スウィフトカウハイド + オーストリッチスキン <span class="price-tag">¥122,000</span>
      </div>
      <div class="leather-item" data-type="Swift Cowhide + Lizard Skin" data-price-jpy="122000">
        スウィフトカウハイド + リザードスキン <span class="price-tag">¥122,000</span>
      </div>
      <div class="leather-item" data-type="Swift Cowhide + Python Skin" data-price-jpy="122000">
        スウィフトカウハイド + パイソンスキン <span class="price-tag">¥122,000</span>
      </div>
    </div>
    
    <div class="btn-group">
      <button class="prev-btn" id="prevBtn">戻る ・ 前のページ</button>
      <button class="next-btn" id="nextBtn">次へ ・ カラープレビュー</button>
    </div>
  </div>

  <script>
    const leatherList = document.getElementById('leatherList');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentPriceJPYEl = document.getElementById('currentPriceJPY');
    let selectedLeather = 'Swift Cowhide'; // 默认第一项

    // 读取已保存的皮革选项（兼容原版存储键名）
    const savedLeather = localStorage.getItem('leatherType');
    const savedPriceJPY = localStorage.getItem('basePriceJPY');
    if (savedLeather && savedPriceJPY) {
      document.querySelectorAll('.leather-item').forEach(item => {
        if (item.dataset.type === savedLeather) {
          item.classList.add('active');
          selectedLeather = savedLeather;
          currentPriceJPYEl.innerText = parseInt(savedPriceJPY).toLocaleString('ja-JP');
        }
      });
    } else {
      // 初始化默认价格到本地存储
      localStorage.setItem('customLeather', selectedLeather);
      localStorage.setItem('basePriceJPY', '57000');
      localStorage.setItem('leatherType', selectedLeather);
    }

    // 皮革选项点击事件
    leatherList.addEventListener('click', (e) => {
      if (e.target.classList.contains('leather-item')) {
        // 更新选中状态
        document.querySelectorAll('.leather-item').forEach(item => item.classList.remove('active'));
        e.target.classList.add('active');
        
        // 更新选中值与价格（千位分隔符格式化）
        selectedLeather = e.target.dataset.type;
        const priceJPY = e.target.dataset.priceJpy;
        currentPriceJPYEl.innerText = parseInt(priceJPY).toLocaleString('ja-JP');
        
        // 保存到本地存储
        localStorage.setItem('customLeather', selectedLeather);
        localStorage.setItem('basePriceJPY', priceJPY);
        localStorage.setItem('leatherType', selectedLeather);
      }
    });

    // 返回按钮
    prevBtn.addEventListener('click', () => {
      window.location.href = '1.size.html';
    });

    // 下一步按钮
    nextBtn.addEventListener('click', () => {
      window.location.href = '3.color.html';
    });
  </script>
</body>
</html>
