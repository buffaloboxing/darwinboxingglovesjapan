<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2. 选择皮革类型 | BUFFALO BOXING</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 40px 20px; 
      max-width: 750px; 
      margin: 0 auto; 
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .page-frame {
      background: #ffffff;
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      padding: 48px 40px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid #1a1a1a;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #1a1a1a;
    }
    .brand-series {
      font-size: 11px;
      letter-spacing: 4px;
      color: #666;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .page-title { 
      font-size: 20px; 
      font-weight: 500; 
      margin-bottom: 24px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }
    .current-price {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    .current-price span {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a1a;
      margin-left: 8px;
    }
    .leather-list { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-bottom: 60px; 
    }
    .leather-item { 
      border: 1px solid #d9d9d9; 
      padding: 18px 20px; 
      border-radius: 2px; 
      cursor: pointer; 
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }
    .leather-item:hover {
      border-color: #1a1a1a;
    }
    .leather-item.active { 
      border-color: #1a1a1a; 
      background: #fafafa; 
      color: #1a1a1a;
    }
    .price-tag { 
      color: #1a1a1a; 
      font-weight: 500;
      font-size: 15px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .prev-btn, .next-btn {
      flex: 1;
      padding: 16px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 2px;
      transition: all 0.2s ease;
    }
    .prev-btn {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #d9d9d9;
    }
    .prev-btn:hover {
      border-color: #1a1a1a;
    }
    .next-btn {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #1a1a1a;
    }
    .next-btn:hover {
      background: #000;
      border-color: #000;
    }
  </style>
</head>
<body>
  <div class="page-frame">
    <div class="brand-header">
      <div class="brand-name">BUFFALO BOXING</div>
      <div class="brand-series">Darwin Custom Series</div>
    </div>

    <div class="page-title">选择皮革类型 / Leather</div>
    
    <div class="current-price">基础价格 <span>¥<span id="currentPrice">1699</span></span></div>
    
    <div class="leather-list" id="leatherList">
      <div class="leather-item active" data-type="Swift牛皮" data-price="1699">
        <span>Swift 牛皮</span>
        <span class="price-tag">¥1699</span>
      </div>
      <div class="leather-item" data-type="Swift牛皮+野牛皮" data-price="1899">
        <span>Swift 牛皮 + 野牛皮</span>
        <span class="price-tag">¥1899</span>
      </div>
      <div class="leather-item" data-type="Swift牛皮+鲨鱼皮" data-price="3599">
        <span>Swift 牛皮 + 鲨鱼皮</span>
        <span class="price-tag">¥3599</span>
      </div>
      <div class="leather-item" data-type="Swift牛皮+鳄鱼皮" data-price="3999">
        <span>Swift 牛皮 + 鳄鱼皮</span>
        <span class="price-tag">¥3999</span>
      </div>
      <div class="leather-item" data-type="Swift牛皮+鸵鸟皮" data-price="3999">
        <span>Swift 牛皮 + 鸵鸟皮</span>
        <span class="price-tag">¥3999</span>
      </div>
      <div class="leather-item" data-type="Swift牛皮+蜥蜴皮" data-price="3999">
        <span>Swift 牛皮 + 蜥蜴皮</span>
        <span class="price-tag">¥3999</span>
      </div>
    </div>
    
    <div class="btn-group">
      <button class="prev-btn" id="prevBtn">BACK · 返回</button>
      <button class="next-btn" id="nextBtn">NEXT · 配色预览</button>
    </div>
  </div>

  <script>
    const leatherList = document.getElementById('leatherList');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentPriceEl = document.getElementById('currentPrice');
    let selectedLeather = 'Swift牛皮';

    // 读取已选皮革（如果有）
    const savedLeather = localStorage.getItem('leatherType');
    const savedPrice = localStorage.getItem('basePrice');
    if (savedLeather && savedPrice) {
      document.querySelectorAll('.leather-item').forEach(item => {
        if (item.dataset.type === savedLeather) {
          item.classList.add('active');
          selectedLeather = savedLeather;
          currentPriceEl.innerText = savedPrice;
        }
      });
    } else {
      localStorage.setItem('customLeather', selectedLeather);
      localStorage.setItem('basePrice', '1699');
      localStorage.setItem('leatherType', selectedLeather);
    }

    // 皮革选项点击事件
    leatherList.addEventListener('click', (e) => {
      const target = e.target.closest('.leather-item');
      if (target) {
        document.querySelectorAll('.leather-item').forEach(item => item.classList.remove('active'));
        target.classList.add('active');
        
        selectedLeather = target.dataset.type;
        const price = target.dataset.price;
        currentPriceEl.innerText = price;
        
        localStorage.setItem('customLeather', selectedLeather);
        localStorage.setItem('basePrice', price);
        localStorage.setItem('leatherType', selectedLeather);
      }
    });

    prevBtn.addEventListener('click', () => {
      window.location.href = '1.size.html';
    });

    nextBtn.addEventListener('click', () => {
      window.location.href = '3.color.html';
    });
  </script>
</body>
</html>
