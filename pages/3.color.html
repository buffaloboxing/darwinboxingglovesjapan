<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8">
    <title>3. カラープレビュー | BUFFALO BOXING</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", "Segoe UI", Arial, sans-serif;
            padding: 40px 20px; 
            max-width: 750px; 
            margin: 0 auto; 
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }
        .page-frame {
            background: #ffffff;
            border: 1px solid #1a1a1a;
            border-radius: 2px;
            padding: 48px 40px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 24px;
            border-bottom: 1px solid #1a1a1a;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #1a1a1a;
        }
        .brand-series {
            font-size: 11px;
            letter-spacing: 4px;
            color: #666;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .page-title { 
            font-size: 20px; 
            font-weight: 500; 
            margin-bottom: 24px;
            color: #1a1a1a;
            letter-spacing: 1px;
        }
        .current-price { 
            font-size: 14px; 
            color: #666; 
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1a1a1a;
        }
        .current-price span {
            font-size: 22px;
            font-weight: 500;
            color: #1a1a1a;
            margin-left: 8px;
        }
        .price-alert { 
            padding: 12px 16px; 
            background: #fafafa; 
            border: 1px solid #d9d9d9; 
            border-radius: 2px; 
            margin-bottom: 20px; 
            color: #1a1a1a; 
            font-size: 13px; 
            display: none; 
            line-height: 1.7;
        }
        .alert-box { 
            padding: 14px 18px; 
            background: #fafafa; 
            border: 1px solid #d9d9d9; 
            border-radius: 2px; 
            margin: 20px 0; 
            color: #333; 
            font-size: 13px; 
            line-height: 1.7;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 360px;
            border: 1px solid #d9d9d9;
            border-radius: 2px;
            background-color: #fafafa;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .canvas-placeholder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: #999; font-size: 14px; z-index: 1;
        }
        #canvasContainer { position: relative; width: 100%; height: 100%; }
        /* 等比例显示，不拉伸变形 */
        #canvasContainer canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            transform: translate(-50%, -50%);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .color-rules {
            margin-bottom: 24px;
        }
        .color-rule { 
            font-size: 13px; 
            color: #666; 
            margin: 6px 0; 
            line-height: 1.6; 
        }
        .controls { 
            padding: 20px; 
            background: #fafafa; 
            border-radius: 2px;
            margin-bottom: 40px;
            border: 1px solid #d9d9d9;
        }
        .controls label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        select { 
            padding: 10px 12px; 
            border: 1px solid #d9d9d9; 
            border-radius: 2px; 
            margin: 10px 0 20px; 
            width: 100%; 
            box-sizing: border-box;
            background: #fff;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.2s ease;
            font-family: inherit;
        }
        select:focus {
            border-color: #1a1a1a;
        }
        .color-container {
            position: relative; 
            margin-top: 10px; 
            width: 100%;
            display: flex; 
            flex-wrap: wrap; 
            gap: 16px 12px;
        }
        .color-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            width: 60px;
            transition: transform 0.2s ease;
        }
        .color-item:hover { transform: translateY(-2px); }

        .color-circle {
            width: 32px; 
            height: 32px; 
            border-radius: 50%;
            box-shadow: 0 0 0 2px transparent;
            transition: all 0.2s ease;
            border: 1px solid rgba(0,0,0,0.08);
        }
        .color-circle.selected {
            box-shadow: 0 0 0 2px #1a1a1a, 0 0 0 4px rgba(26, 26, 26, 0.08);
            transform: scale(1.05);
        }
        .color-name {
            font-size: 12px;
            color: #666;
            text-align: center;
            line-height: 1.2;
            word-break: break-all;
        }

        .btn-group { 
            display: flex; 
            gap: 12px; 
        }
        .prev-btn, .next-btn { 
            flex: 1; 
            padding: 16px; 
            border-radius: 2px; 
            cursor: pointer; 
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .prev-btn { 
            background: #fff; 
            color: #1a1a1a; 
            border: 1px solid #d9d9d9; 
        }
        .prev-btn:hover {
            border-color: #1a1a1a;
        }
        .next-btn { 
            background: #1a1a1a; 
            color: #fff; 
            border: 1px solid #1a1a1a;
        }
        .next-btn:hover {
            background: #000;
            border-color: #000;
        }
    </style>
</head>
<body>
<div class="page-frame">
    <div class="brand-header">
        <div class="brand-name">BUFFALO BOXING</div>
        <div class="brand-series">DARWIN CUSTOM SERIES</div>
    </div>

    <div class="page-title">カラープレビュー</div>

    <div class="current-price">現在の価格：¥<span id="currentPriceJPY">57,000</span></div>
    <div class="price-alert" id="priceAlert"></div>

    <div class="canvas-container">
        <div class="canvas-placeholder">グローブプレビューを読み込み中...</div>
        <div id="canvasContainer"></div>
    </div>

    <div id="leatherTip" class="alert-box" style="display: none;"></div>

    <div class="color-rules">
        <div class="color-rule">・①～③エリア：基本2色無料、追加1色ごとに¥9,000</div>
        <div class="color-rule">・④～⑧エリア：ベースに加えて1色無料、追加1色ごとに¥6,000</div>
    </div>

    <div class="controls">
        <div>
            <label>配色するエリアを選択</label>
            <select id="areaSelect">
                <option value="1">エリア ①</option>
                <option value="2">エリア ②</option>
                <option value="3">エリア ③</option>
                <option value="4">エリア ④</option>
                <option value="5">エリア ⑤</option>
                <option value="6">エリア ⑥</option>
                <option value="7">エリア ⑦</option>
                <option value="8">エリア ⑧</option>
            </select>
        </div>
        <div>
            <label>カラーを選択</label>
            <div class="color-container" id="colorContainer"></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="prev-btn" id="prevBtn">戻る ・ 前のページ</button>
        <button class="next-btn" id="nextBtn">次へ ・ カスタマイズ</button>
    </div>
</div>

<script>
    /* ==================== 初回訪問時にカラー状態をリセット ==================== */
    const isFirstVisit = !localStorage.getItem('hasVisitedColorPageJP');
    if (isFirstVisit) {
        localStorage.removeItem('areaColors');
        localStorage.removeItem('colorExtraJPY');
        localStorage.setItem('hasVisitedColorPageJP', 'true');
    }

    /* ==================== コア着色ロジック ==================== */
    const TOTAL_LAYERS = 8;
    const CANVAS_SIZE = { w: 1632, h: 1280 };

    const container = document.getElementById('canvasContainer');
    const placeholder = document.querySelector('.canvas-placeholder');
    const areaSelect = document.getElementById('areaSelect');
    const colorContainer = document.getElementById('colorContainer');
    const currentPriceJPYEl = document.getElementById('currentPriceJPY');
    const priceAlert = document.getElementById('priceAlert');
    const leatherTip = document.getElementById('leatherTip');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let basePriceJPY = Math.max(0, parseInt(localStorage.getItem('basePriceJPY')) || 57000);
    let colorExtraJPY = 0;
    const areaColors = { '1': null, '2': null, '3': null, '4': null, '5': null, '6': null, '7': null, '8': null };

    const canvases = [], ctxs = [], images = [], tintedData = [];
    let selectedIdx = 0;

    // キャンバスレイヤーを作成
    for (let i = 0; i < TOTAL_LAYERS; i++) {
        const cvs = document.createElement('canvas');
        cvs.width = CANVAS_SIZE.w;
        cvs.height = CANVAS_SIZE.h;
        cvs.style.zIndex = TOTAL_LAYERS - i;
        container.appendChild(cvs);
        const ctx = cvs.getContext('2d');
        canvases.push(cvs);
        ctxs.push(ctx);
        tintedData.push(null);
    }

    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error(`読み込み失敗: ${src}`));
            img.src = src;
        });
    }

    async function initImages() {
        const promises = [];
        for (let i = 1; i <= TOTAL_LAYERS; i++) {
            promises.push(loadImage(`..\\images\\${i}.png`));
        }
        const loaded = await Promise.all(promises);
        loaded.forEach((img, idx) => {
            images[idx] = img;
            renderLayer(idx);
        });
        placeholder.style.display = 'none';
    }

    function renderLayer(idx) {
        const ctx = ctxs[idx];
        ctx.clearRect(0, 0, CANVAS_SIZE.w, CANVAS_SIZE.h);
        const img = images[idx];
        ctx.drawImage(img, 0, 0);

        if (tintedData[idx]) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = CANVAS_SIZE.w;
            tempCanvas.height = CANVAS_SIZE.h;
            const tctx = tempCanvas.getContext('2d');
            tctx.drawImage(img, 0, 0);
            const alphaData = tctx.getImageData(0, 0, CANVAS_SIZE.w, CANVAS_SIZE.h);
            const tinted = tintedData[idx];

            for (let i = 0; i < alphaData.data.length; i += 4) {
                if (alphaData.data[i + 3] > 0) {
                    tinted.data[i + 3] = alphaData.data[i + 3];
                } else {
                    tinted.data[i + 3] = 0;
                }
            }
            ctx.putImageData(tinted, 0, 0);
        }
    }

    function tintLayer(idx, colorHex) {
        const ctx = ctxs[idx];
        const img = images[idx];
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, CANVAS_SIZE.w, CANVAS_SIZE.h);
        const data = imageData.data;

        const rTarget = parseInt(colorHex.slice(1, 3), 16);
        const gTarget = parseInt(colorHex.slice(3, 5), 16);
        const bTarget = parseInt(colorHex.slice(5, 7), 16);

        for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] === 0) continue;
            const srcR = data[i] / 255;
            const srcG = data[i + 1] / 255;
            const srcB = data[i + 2] / 255;
            data[i] = srcR * rTarget;
            data[i + 1] = srcG * gTarget;
            data[i + 2] = srcB * bTarget;
        }

        tintedData[idx] = imageData;
        renderLayer(idx);
    }

    /* ==================== カラー選択 ==================== */
    const colors = [
        { code: '#FFFFFF', name: 'ピュアホワイト' }, { code: '#F5F0EB', name: 'ミルクセーキホワイト' },
        { code: '#9D5F3B', name: 'ゴールドブラウン' }, { code: '#746148', name: 'エレファントグレー' },
        { code: '#1E2E44', name: 'ミッドナイトブルー' }, { code: '#000000', name: 'ブラック' },
        { code: '#80412D', name: 'キャラメルブラウン' }, { code: '#3FBF72', name: 'コミックグリーン' },
        { code: '#B3A59A', name: 'トレンチグレー' }, { code: '#F27D3C', name: 'オレンジ' },
        { code: '#F2C12E', name: 'サンイエロー' }, { code: '#F9E77F', name: 'チックイエロー' },
        { code: '#404234', name: 'オリーブグリーン' }, { code: '#BDE0F2', name: 'ブリーズブルー' },
        { code: '#A0E7E5', name: 'ティファニーブルー' }, { code: '#0D32C4', name: 'クラインブルー' },
        { code: '#91A3B1', name: 'リネンブルー' }, { code: '#C0A086', name: 'マラケシュブラウン' },
        { code: '#8C8969', name: 'セージグリーン' }, { code: '#808080', name: 'ストームクラウドグレー' },
        { code: '#BE3033', name: 'ブライトレッド' }, { code: '#EEB9C9', name: 'サクラピンク' },
        { code: '#DF6981', name: 'ローズピンク' }, { code: '#E4A3BB', name: 'ペタルピンク' },
        { code: '#6A2A30', name: 'バーガンディ' }, { code: '#FFD700', name: 'レモンイエロー' },
        { code: '#C6AEA6', name: 'アプリコット' }, { code: '#294162', name: 'ディープブルー' },
        { code: '#C0C0C0', name: 'シーガルグレー' }, { code: '#402D2D', name: 'ダークコーヒー' }
    ];

    function createColorCircles() {
        colorContainer.innerHTML = '';
        colors.forEach(color => {
            const item = document.createElement('div');
            item.className = 'color-item';

            const circle = document.createElement('div');
            circle.className = 'color-circle';
            circle.style.backgroundColor = color.code;
            circle.dataset.color = color.code;

            const nameEl = document.createElement('div');
            nameEl.className = 'color-name';
            nameEl.textContent = color.name;

            item.appendChild(circle);
            item.appendChild(nameEl);

            item.onclick = () => {
                document.querySelectorAll('.color-circle').forEach(el => el.classList.remove('selected'));
                circle.classList.add('selected');
                const area = areaSelect.value;
                areaColors[area] = color.code;
                tintLayer(parseInt(area) - 1, color.code);
                calculatePrice();
            };

            colorContainer.appendChild(item);
        });
    }

    areaSelect.addEventListener('change', () => {
        selectedIdx = parseInt(areaSelect.value) - 1;
        const currentColor = areaColors[areaSelect.value];
        document.querySelectorAll('.color-circle').forEach(el => {
            el.classList.toggle('selected', el.dataset.color === currentColor);
        });
    });

    /* ==================== 価格計算＆注意喚起ロジック ==================== */
    function calculatePrice() {
        const leatherType = localStorage.getItem('leatherType') || '';
        const isWildCowhide = leatherType.includes('Wild Cowhide');
        const area123Colors = new Set();
        const area45678Colors = new Set();

        for (let i = 1; i <= 8; i++) {
            const color = areaColors[i];
            if (!color) continue;
            if (isWildCowhide && color === '#80412D') continue;
            if (i <= 3) area123Colors.add(color);
            else area45678Colors.add(color);
        }

        const newColorsIn45678 = new Set();
        area45678Colors.forEach(c => !area123Colors.has(c) && newColorsIn45678.add(c));

        let extra = 0;
        let alertText = '';

        const area123Free = isWildCowhide ? 3 : 2;
        if (area123Colors.size > area123Free) {
            const over = area123Colors.size - area123Free;
            extra += over * 9000;
            alertText += `・①～③エリア：追加色${over}点、+¥${(over*9000).toLocaleString('ja-JP')}\n`;
        }

        const area45678Free = isWildCowhide ? 2 : 1;
        if (newColorsIn45678.size > area45678Free) {
            const over = newColorsIn45678.size - area45678Free;
            extra += over * 6000;
            alertText += `・④～⑧エリア：追加色${over}点、+¥${(over*6000).toLocaleString('ja-JP')}`;
        }

        priceAlert.textContent = alertText;
        priceAlert.style.display = alertText ? 'block' : 'none';

        colorExtraJPY = extra;
        currentPriceJPYEl.innerText = (basePriceJPY + colorExtraJPY).toLocaleString('ja-JP');
        localStorage.setItem('colorExtraJPY', colorExtraJPY);
        localStorage.setItem('areaColors', JSON.stringify(areaColors));
    }

    function showLeatherTip() {
        const leatherType = localStorage.getItem('leatherType') || '';
        if (leatherType.includes('Wild Cowhide')) {
            leatherTip.textContent = 'ワイルドカウハイドはダークブラウン固定となります。通常カウハイドの無料2色のカウントには含まれません。';
            leatherTip.style.display = 'block';
        } else if (/Shark|Crocodile|Ostrich|Lizard|Python/.test(leatherType)) {
            leatherTip.textContent = 'エキゾチックレザーには固定のカラーチャートがありません。一般的なカラー：ブラック、ブラウン、ホワイト。プレビューには類似色を使用してください。実際の在庫カラーは別途ご確認いたします。エキゾチックレザーは②と⑤エリアに標準で使用されます。その他のエリアへの適用は別途お見積もりいたしますのでお問い合わせください。';
            leatherTip.style.display = 'block';
        } else {
            leatherTip.style.display = 'none';
        }
    }

    /* ==================== ページ遷移 ==================== */
    prevBtn.onclick = () => { window.location.href = '2.leather.html'; };
    nextBtn.onclick = () => {
        localStorage.setItem('areaColors', JSON.stringify(areaColors));
        localStorage.setItem('colorExtraJPY', colorExtraJPY);
        window.location.href = '4.customize.html';
    };

    /* ==================== 初期化 ==================== */
    const saved = localStorage.getItem('areaColors');
    if (saved && !isFirstVisit) {
        Object.assign(areaColors, JSON.parse(saved));
    }

    initImages().then(() => {
        createColorCircles();
        showLeatherTip();

        if (saved && !isFirstVisit) {
            setTimeout(() => {
                Object.keys(areaColors).forEach(area => {
                    const color = areaColors[area];
                    if (color) tintLayer(parseInt(area) - 1, color);
                });
                calculatePrice();
            }, 100);
        } else {
            calculatePrice();
        }
    }).catch(err => {
        console.error(err);
        placeholder.textContent = '画像の読み込みに失敗しました。1.png～8.pngが存在することをご確認ください。';
    });
</script>
</body>
</html>
